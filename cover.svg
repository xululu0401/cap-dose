  <line x1="120" y1="322" x2="1080" y2="322" stroke="#e3ddc9" stroke-dasharray="10 10"/>
  <text x="120" y="400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#55523f">稀释 1000 倍，只兑 1.5 L，要加</text>
  <text x="120" y="540" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="140" font-weight="700" fill="#56702b">1.5 mL</text>
