  <text x="120" y="930" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" fill="#55523f">5 mL 注射器量 1.5 mL → 偏 0%</text>
  <text x="120" y="980" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" fill="#55523f">倒多了要救回：补到 8 L（这只壶 2 L 装不下）</text>
  <text x="120" y="1080" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#827d66">默认场景为虚构示例 · 只做按标签的算术，不推荐浓度、不判断安全</text>
